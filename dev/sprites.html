<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sprite viewer (dev only)</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #2a2438;
        color: #e8e4f0;
        font: 12px/1.3 system-ui, sans-serif;
      }
      h2 {
        margin: 14px 0 6px;
        font-size: 14px;
      }
      .sheet {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: flex-end;
      }
      figure {
        margin: 0;
        padding: 4px;
        background: #3a3350;
        text-align: center;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
        margin: 0 auto 2px;
      }
      #controls {
        position: sticky;
        top: 0;
        background: #2a2438;
        padding: 4px 0;
      }
    </style>
  </head>
  <body>
    <div id="controls">Kind: <select id="kind"></select> Scale: <select id="scale"></select></div>
    <div id="root"></div>
    <script type="module" src="./sprites.ts"></script>
  </body>
</html>
